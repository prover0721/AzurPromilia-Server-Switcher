[project]
name = "azur-promilia-server-switcher"
version = "0.1.0"
description = "Cross-server resource sharing & switcher for Azur Promilia (PC) with GameHub plugin support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
    "PySide6-Fluent-Widgets>=1.6.0",
]

[project.scripts]
azur-promilia-switcher = "main:main"
